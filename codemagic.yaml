workflows:
  android:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Debug info
        script: |
          flutter --version
          dart --version
          echo "Flutter path: $(which flutter)"
          echo "Dart path: $(which dart)"
          ls -la android/
          cat android/local.properties 2>/dev/null || echo "No local.properties"
      - name: Analyze code
        script: flutter analyze --no-fatal-infos 2>&1 || true
      - name: Build Android APK
        script: flutter build apk --debug 2>&1
    artifacts:
      - build/**/outputs/**/*.apk

  web:
    name: Web Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Web
        script: flutter build web
    artifacts:
      - build/web/**
